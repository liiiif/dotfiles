
# ==========================================
# KITTY - TOKYO NIGHT
# EndeavourOS + KDE Plasma
# ==========================================

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.5

# Cursore
cursor_shape block
cursor_blink_interval 0

# Spaziatura
window_padding_width 10
hide_window_decorations yes

# Trasparenza e blur
background_opacity 0.01
background_blur 10
dynamic_background_opacity yes

# Colori Tokyo Night
foreground #c0caf5
background #1a1b26

selection_foreground #c0caf5
selection_background #33467c

cursor #c0caf5
cursor_text_color #1a1b26

# Colori base
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Colori luminosi
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Tab
tab_bar_style powerline
active_tab_foreground #1a1b26
active_tab_background #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #24283b

# Comportamento
enable_audio_bell no
confirm_os_window_close 0